apiVersion: v1
kind: Service
metadata:
  name: sre-demo-api
  namespace: sre-demo
  labels:
    app.kubernetes.io/name: sre-demo-api
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "10.1.3.250"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: sre-demo-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
