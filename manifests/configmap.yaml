apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-demo-api-config
  namespace: sre-demo
  labels:
    app.kubernetes.io/name: sre-demo-api
    purpose: sre-demo
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"
  DOTNET_EnableDiagnostics: "0"
  DOTNET_RUNNING_IN_CONTAINER: "true"
  OTEL_SERVICE_NAME: "sre-demo-api"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=sre-demo,deployment.environment=production"
  Storage__AccountUrl: "__STORAGE_ACCOUNT_URL__"
  Storage__ContainerName: "operations"
  Storage__MaxRetries: "3"
  Storage__RetryDelayMs: "200"
  Storage__NetworkTimeoutSeconds: "10"
  FaultInjection__LatencyEnabled: "false"
  FaultInjection__LatencyMinMs: "0"
  FaultInjection__LatencyMaxMs: "0"
  FaultInjection__HttpErrorRate: "0"
  FaultInjection__HttpErrorStatusCode: "503"
  FaultInjection__StorageErrorRate: "0"
  APP_FAULT_LATENCY_MS: "0"
  APP_FAULT_ERROR_RATE_PERCENT: "0"
